name: Linux Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system build tools
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update -y
          sudo apt install libtbb-dev -y
          sudo apt-get install -y \
            ninja-build \
            gcc-13 \
            g++-13 \
            autoconf \
            automake \
            autoconf-archive

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "${RUNNER_TEMP}/vcpkg"
          "${RUNNER_TEMP}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> "${GITHUB_ENV}"

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake --preset=vcpkg \
            -DCMAKE_BUILD_TYPE=Release \
            -DSSP4SIM_BUILD_TEST=ON \
            -DSSP4SIM_BUILD_PYTHON_API=ON \
            -DVCPKG_MANIFEST_FEATURES=python-api

      - name: Build
        run: cmake --build build --config Release

      - name: Verify Python API artifact exists
        run: ls -l build/public/python_api/pyssp4sim

      - name: Run tests
        run: ./build/tests/ssp4sim_tests

      - name: Install to staging directory
        run: cmake --install build --prefix dist/ssp4sim

      - name: Build Python wheel from staged package
        run: |
          VCPKG_PY="$(readlink -f build/vcpkg_installed/x64-linux/tools/python3/python3.11)"
          "${VCPKG_PY}" -m ensurepip --upgrade
          "${VCPKG_PY}" -m pip install --upgrade pip setuptools wheel

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            WHEEL_VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE_VERSION="$(cat version.txt)"
            WHEEL_VERSION="${BASE_VERSION}.dev$(date +%Y%m%d)"
          fi

          cat > dist/ssp4sim/python/setup_release.py <<EOF
          from setuptools import setup
          from wheel.bdist_wheel import bdist_wheel as _bdist_wheel

          class _BinaryWheel(_bdist_wheel):
              def finalize_options(self):
                  super().finalize_options()
                  self.root_is_pure = False

          setup(
              name="pyssp4sim",
              version="${WHEEL_VERSION}",
              packages=["pyssp4sim"],
              include_package_data=True,
              package_data={"pyssp4sim": ["*.so", "*.pyd", "*.dll", "*.dylib"]},
              cmdclass={"bdist_wheel": _BinaryWheel},
          )
          EOF

          (
            cd dist/ssp4sim/python
            "${VCPKG_PY}" setup_release.py bdist_wheel \
              --dist-dir ../../ \
              --plat-name linux_x86_64
          )

      - name: Create release metadata and package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "main" ]; then
            VERSION="dev-$(date +%Y%m%d)"
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"
          PACKAGE_BASE="ssp4sim-linux-x86_64-${VERSION}"
          PACKAGE_ALIAS="ssp4sim-linux-x86_64-latest.tar.gz"
          WHEEL_ALIAS="pyssp4sim-latest.whl"

          cat > dist/ssp4sim/RELEASE.txt <<EOF
          version=${VERSION}
          commit=${COMMIT_SHA}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          tar -C dist -czf "dist/${PACKAGE_BASE}.tar.gz" ssp4sim

          WHEEL_FILE="$(ls -1 dist/pyssp4sim-*.whl | head -n 1)"
          if [ -z "${WHEEL_FILE}" ]; then
            echo "No wheel found in dist/"
            exit 1
          fi

          cp -f "dist/${PACKAGE_BASE}.tar.gz" "dist/${PACKAGE_ALIAS}"
          cp -f "${WHEEL_FILE}" "dist/${WHEEL_ALIAS}"

          (
            cd dist
            sha256sum "${PACKAGE_BASE}.tar.gz" "${PACKAGE_ALIAS}" *.whl > SHA256SUMS
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
