name: Linux Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Native Linux build-environment changes belong in the project
      # Containerfile so local container builds and CI stay aligned.
      - name: Build project container image
        run: ./containers/build_ubuntu22_gcc13_container.sh

      - name: Configure
        run: |
          ./containers/run_ubuntu22_gcc13_container.sh -- \
            /bin/bash -lc '
              cmake --preset=vcpkg \
                -DCMAKE_BUILD_TYPE=Release \
                -DSSP4SIM_BUILD_TEST=ON \
                -DSSP4SIM_BUILD_PYTHON_API=ON
            '

      - name: Build
        run: |
          ./containers/run_ubuntu22_gcc13_container.sh -- \
            cmake --build build --config Release

      - name: Verify Python API artifact exists
        run: |
          ./containers/run_ubuntu22_gcc13_container.sh -- \
            ls -l build/public/python_api/pyssp4sim

      - name: Run tests
        run: |
          ./containers/run_ubuntu22_gcc13_container.sh -- \
            ./build/tests/ssp4sim_tests

      - name: Install to staging directory
        run: |
          ./containers/run_ubuntu22_gcc13_container.sh -- \
            cmake --install build --prefix dist/ssp4sim


      # TODO: break out into release script for reuse 
      - name: Build Python wheel from staged package
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ./containers/run_ubuntu22_gcc13_container.sh \
            --env GITHUB_REF \
            --env GITHUB_REF_NAME \
            -- \
            /bin/bash -lc '
              VCPKG_PY="$(readlink -f build/vcpkg_installed/x64-linux/tools/python3/python3.11)"
              "${VCPKG_PY}" -m ensurepip --upgrade
              "${VCPKG_PY}" -m pip install --upgrade pip setuptools wheel

              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                WHEEL_VERSION="${GITHUB_REF_NAME#v}"
              else
                WHEEL_VERSION="0.0.0.dev$(date +%Y%m%d)+$(git rev-parse --short HEAD)"
              fi
              WHEEL_ALIAS_VERSION="0.0.0+lat"

              for VERSION in "${WHEEL_VERSION}" "${WHEEL_ALIAS_VERSION}"; do
                cp -f scripts/release/setup_release.py.template dist/ssp4sim/python/setup_release.py
                sed -i "s|__WHEEL_VERSION__|${VERSION}|g" dist/ssp4sim/python/setup_release.py

                (
                  cd dist/ssp4sim/python
                  "${VCPKG_PY}" setup_release.py bdist_wheel \
                    --dist-dir ../../ \
                    --plat-name linux_x86_64
                )
              done
            '
      # TODO: break out into release script for reuse 
      - name: Create release metadata and package
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ./containers/run_ubuntu22_gcc13_container.sh \
            --env GITHUB_REF_NAME \
            -- \
            /bin/bash -lc '
              VERSION="${GITHUB_REF_NAME}"
              if [ -z "${VERSION}" ] || [ "${VERSION}" = "main" ]; then
                VERSION="dev-$(date +%Y%m%d)"
              fi
              COMMIT_SHA="$(git rev-parse HEAD)"
              PACKAGE_BASE="ssp4sim-linux-x86_64-${VERSION}"
              PACKAGE_ALIAS="ssp4sim-linux-x86_64-latest.tar.gz"

              BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              cp -f scripts/release/RELEASE.txt.template dist/ssp4sim/RELEASE.txt
              sed -i "s|__VERSION__|${VERSION}|g" dist/ssp4sim/RELEASE.txt
              sed -i "s|__COMMIT_SHA__|${COMMIT_SHA}|g" dist/ssp4sim/RELEASE.txt
              sed -i "s|__BUILT_AT__|${BUILT_AT}|g" dist/ssp4sim/RELEASE.txt

              tar -C dist -czf "dist/${PACKAGE_BASE}.tar.gz" ssp4sim

              if ! ls -1 dist/pyssp4sim-*.whl >/dev/null 2>&1; then
                echo "No wheel found in dist/"
                exit 1
              fi

              cp -f "dist/${PACKAGE_BASE}.tar.gz" "dist/${PACKAGE_ALIAS}"

              (
                cd dist
                sha256sum "${PACKAGE_BASE}.tar.gz" "${PACKAGE_ALIAS}" pyssp4sim-*.whl > SHA256SUMS
              )
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
