name: Linux Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "${RUNNER_TEMP}/vcpkg"
          "${RUNNER_TEMP}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          cmake --preset=vcpkg \
            -DCMAKE_BUILD_TYPE=Release \
            -DSSP4SIM_BUILD_TEST=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ./build/tests/ssp4sim_tests

      - name: Install to staging directory
        run: cmake --install build --prefix dist/ssp4sim

      - name: Create release metadata and package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "main" ]; then
            VERSION="dev-$(date +%Y%m%d)"
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"
          PACKAGE_BASE="ssp4sim-linux-x86_64-${VERSION}"

          cat > dist/ssp4sim/RELEASE.txt <<EOF
          version=${VERSION}
          commit=${COMMIT_SHA}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          tar -C dist -czf "dist/${PACKAGE_BASE}.tar.gz" ssp4sim
          (
            cd dist
            sha256sum "${PACKAGE_BASE}.tar.gz" > SHA256SUMS
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
